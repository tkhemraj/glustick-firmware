[platformio]
default_envs = heltec_v3
boards_dir   = boards

[env:heltec_v3]
platform  = espressif32
board     = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
extra_scripts = pre:scripts/patch_lmic.py

lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library @ ^4.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    olikraus/U8g2 @ ^2.35.9
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -Wl,--allow-multiple-definition
    -D CFG_us915=1
    -D PIN_LMIC_NSS=8
    -D PIN_LMIC_RXTX=LMIC_UNUSED_PIN
    -D PIN_LMIC_RST=12
    -D PIN_LMIC_DIO0=LMIC_UNUSED_PIN
    -D PIN_LMIC_DIO1=14
    -D PIN_LMIC_DIO2=LMIC_UNUSED_PIN
    -D OLED_SDA=17
    -D OLED_SCL=18
    -D OLED_RST=21
    -D VBAT_PIN=1
    -D FW_VERSION='"1.0.0"'

[env:heltec_v3_eu868]
extends   = env:heltec_v3
build_flags =
    ${env:heltec_v3.build_flags}
    -U CFG_us915
    -D CFG_eu868=1

; ── T-Deck / T-Deck Plus ──────────────────────────────────────────────────────
; Custom board JSON (boards/T-Deck.json) sets QIO flash + 8MB OPI PSRAM —
; the two things esp32-s3-devkitc-1 gets wrong for this hardware.
; Shared SPI bus: LoRa SX1262 + ST7789 on SCK=40/MOSI=41/MISO=38.
[env:tdeck]
platform  = espressif32
board     = T-Deck
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
extra_scripts = pre:scripts/patch_lmic.py

lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library @ ^4.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    Bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -Wl,--allow-multiple-definition
    -D CFG_us915=1
    -D BOARD_TDECK=1
    ; LoRa SX1262 pins (verified against LILYGO utilities.h)
    -D PIN_LMIC_NSS=9
    -D PIN_LMIC_RXTX=LMIC_UNUSED_PIN
    -D PIN_LMIC_RST=17
    -D PIN_LMIC_DIO0=LMIC_UNUSED_PIN
    -D PIN_LMIC_DIO1=45
    -D PIN_LMIC_DIO2=LMIC_UNUSED_PIN
    ; Shared SPI bus — LMIC's HAL uses wrong defaults; lora_init() calls SPI.begin() first
    -D TDECK_SPI_SCK=40
    -D TDECK_SPI_MISO=38
    -D TDECK_SPI_MOSI=41
    ; Power-on latch — HIGH in initVariant() + top of setup() before anything else
    -D TDECK_POWERON_PIN=10
    ; SD card CS — must be HIGH before any SPI transaction or it corrupts the bus
    -D TDECK_SD_CS=39
    ; SX1262 BUSY pin
    -D LORA_BUSY_PIN=13
    ; Battery ADC
    -D VBAT_PIN=4
    ; TFT_eSPI: ST7789 320×240 IPS (physical 240×320, rotated to landscape)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_MOSI=41
    -D TFT_SCLK=40
    -D TFT_CS=12
    -D TFT_DC=11
    -D TFT_RST=-1
    -D TFT_BL=42
    -D TFT_BACKLIGHT_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000
    ; Logical display dims after setRotation(1)
    -D DISPLAY_WIDTH=320
    -D DISPLAY_HEIGHT=240
    ; Keyboard I²C — addr 0x55, INT on 46
    -D KB_SDA=18
    -D KB_SCL=8
    -D KB_INT=46
    -D KB_ADDR=0x55
    ; Firmware version
    -D FW_VERSION='"1.0.0"'

[env:tdeck_eu868]
extends   = env:tdeck
build_flags =
    ${env:tdeck.build_flags}
    -U CFG_us915
    -D CFG_eu868=1

; ── T-Deck direct P2P (no gateway, no server) ─────────────────────────────────
; Both devices share the same app_key; first 4 bytes become the net ID.
; 915.0 MHz, SF7, BW125, CR4/5.
[env:tdeck_p2p]
extends = env:tdeck
build_flags =
    ${env:tdeck.build_flags}
    -D TRANSPORT_P2P=1
    -D P2P_FREQ_MHZ=915.0f
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    Bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1
    jgromes/RadioLib @ ^6.6.0

; ── T-Deck Meshtastic-compatible mesh node ─────────────────────────────────────
; LongFast PHY (SF9/BW250/CR4/5), 906.875 MHz US915.
; app_key = 128-bit AES PSK; default = public Meshtastic "LongFast" key.
[env:tdeck_meshtastic]
extends = env:tdeck
build_flags =
    ${env:tdeck.build_flags}
    -D TRANSPORT_MESHTASTIC=1
    -D MESH_FREQ_MHZ=906.875f
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    Bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1
    jgromes/RadioLib @ ^6.6.0
