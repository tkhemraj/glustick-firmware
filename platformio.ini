[platformio]
default_envs = heltec_v3

[env:heltec_v3]
platform  = espressif32
board     = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
extra_scripts = pre:scripts/patch_lmic.py

lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library @ ^4.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    olikraus/U8g2 @ ^2.35.9
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1

build_flags =
    ; Radio: SX1262 — configured via scripts/patch_lmic.py patching the LMIC project_config.
    ; --allow-multiple-definition: LMIC's hal_init conflicts with ESP32's libpp.a hal_init;
    ; LMIC's version (linked first) is the one we need for the SX1262 SPI init.
    -Wl,--allow-multiple-definition
    -D CFG_us915=1
    ; Heltec V3 SX1262 pin mapping
    -D PIN_LMIC_NSS=8
    -D PIN_LMIC_RXTX=LMIC_UNUSED_PIN
    -D PIN_LMIC_RST=12
    -D PIN_LMIC_DIO0=LMIC_UNUSED_PIN
    -D PIN_LMIC_DIO1=14
    -D PIN_LMIC_DIO2=LMIC_UNUSED_PIN
    ; OLED
    -D OLED_SDA=17
    -D OLED_SCL=18
    -D OLED_RST=21
    ; Battery ADC
    -D VBAT_PIN=1
    ; Firmware version
    -D FW_VERSION='"1.0.0"'

[env:heltec_v3_eu868]
extends   = env:heltec_v3
build_flags =
    ${env:heltec_v3.build_flags}
    -U CFG_us915
    -D CFG_eu868=1

; ── T-Deck (LILYGO T-Deck / T-Deck Plus) ─────────────────────────────────────
; Shared SPI bus: LoRa SX1262 + ST7789 display both on SCK=40/MOSI=41/MISO=38.
; Each device uses its own CS pin — no conflict.
[env:tdeck]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
extra_scripts = pre:scripts/patch_lmic.py

board_build.flash_size      = 8MB
board_build.partitions      = default_8MB.csv
board_build.arduino.memory_type = qio_opi

lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library @ ^4.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    Bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -Wl,--allow-multiple-definition
    -D CFG_us915=1
    -D BOARD_TDECK=1
    ; LoRa SX1262 pins
    -D PIN_LMIC_NSS=9
    -D PIN_LMIC_RXTX=LMIC_UNUSED_PIN
    -D PIN_LMIC_RST=17
    -D PIN_LMIC_DIO0=LMIC_UNUSED_PIN
    -D PIN_LMIC_DIO1=45
    -D PIN_LMIC_DIO2=LMIC_UNUSED_PIN
    ; T-Deck power-on pin — must be driven HIGH or the board shuts off
    -D TDECK_POWERON_PIN=10
    ; Battery ADC
    -D VBAT_PIN=4
    ; TFT_eSPI: ST7789 240×320 physical, rotated to 320×240 landscape in code
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_MOSI=41
    -D TFT_SCLK=40
    -D TFT_CS=12
    -D TFT_DC=11
    -D TFT_RST=-1
    -D TFT_BL=42
    -D TFT_BACKLIGHT_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000
    ; Logical display dims after setRotation(1) — used by display code
    -D DISPLAY_WIDTH=320
    -D DISPLAY_HEIGHT=240
    ; Keyboard I²C (ES8311-style: addr 0x55)
    -D KB_SDA=18
    -D KB_SCL=8
    -D KB_INT=46
    -D KB_ADDR=0x55
    ; Firmware version
    -D FW_VERSION='"1.0.0"'

[env:tdeck_eu868]
extends   = env:tdeck
build_flags =
    ${env:tdeck.build_flags}
    -U CFG_us915
    -D CFG_eu868=1
