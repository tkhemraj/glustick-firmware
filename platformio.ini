[platformio]
; The product ships on the LilyGo T-Deck (ESP32-S3 + SX1262 + BlackBerry
; keyboard). `elysian` is the canonical build: direct T-Deck<->T-Deck P2P over
; LoRa, no server, no gateway — the "phones off, internet off, can you hear"
; device. The heltec_* envs below are LEGACY (original dev board) kept only for
; reference; they are not the shipping hardware.
default_envs = elysian
boards_dir   = boards

; ── LEGACY: Heltec WiFi LoRa 32 V3 (original dev board, not shipped) ──────────
[env:heltec_v3]
platform  = espressif32
board     = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
extra_scripts = pre:scripts/patch_lmic.py

lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library @ ^4.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    olikraus/U8g2 @ ^2.35.9
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -Wl,--allow-multiple-definition
    -D CFG_us915=1
    -D PIN_LMIC_NSS=8
    -D PIN_LMIC_RXTX=LMIC_UNUSED_PIN
    -D PIN_LMIC_RST=12
    -D PIN_LMIC_DIO0=LMIC_UNUSED_PIN
    -D PIN_LMIC_DIO1=14
    -D PIN_LMIC_DIO2=LMIC_UNUSED_PIN
    -D OLED_SDA=17
    -D OLED_SCL=18
    -D OLED_RST=21
    -D VBAT_PIN=1
    -D FW_VERSION='"1.0.0"'

[env:heltec_v3_eu868]
extends   = env:heltec_v3
build_flags =
    ${env:heltec_v3.build_flags}
    -U CFG_us915
    -D CFG_eu868=1

; ── T-Deck / T-Deck Plus ──────────────────────────────────────────────────────
; Custom board JSON (boards/T-Deck.json) sets QIO flash + 8MB OPI PSRAM —
; the two things esp32-s3-devkitc-1 gets wrong for this hardware.
; Shared SPI bus: LoRa SX1262 + ST7789 on SCK=40/MOSI=41/MISO=38.
[env:tdeck]
platform  = espressif32
board     = T-Deck
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
extra_scripts = pre:scripts/patch_lmic.py

lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library @ ^4.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    moononournation/GFX Library for Arduino @ 1.4.7
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -Wl,--allow-multiple-definition
    -D CFG_us915=1
    -D BOARD_TDECK=1
    ; LoRa SX1262 pins (verified against LILYGO utilities.h)
    -D PIN_LMIC_NSS=9
    -D PIN_LMIC_RXTX=LMIC_UNUSED_PIN
    -D PIN_LMIC_RST=17
    -D PIN_LMIC_DIO0=LMIC_UNUSED_PIN
    -D PIN_LMIC_DIO1=45
    -D PIN_LMIC_DIO2=LMIC_UNUSED_PIN
    ; Shared SPI bus — LMIC's HAL uses wrong defaults; lora_init() calls SPI.begin() first
    -D TDECK_SPI_SCK=40
    -D TDECK_SPI_MISO=38
    -D TDECK_SPI_MOSI=41
    ; Power-on latch — HIGH in initVariant() + top of setup() before anything else
    -D TDECK_POWERON_PIN=10
    ; SD card CS — must be HIGH before any SPI transaction or it corrupts the bus
    -D TDECK_SD_CS=39
    ; SX1262 BUSY pin
    -D LORA_BUSY_PIN=13
    ; Battery ADC
    -D VBAT_PIN=4
    ; Backlight
    -D TFT_BL=42
    -D TFT_BACKLIGHT_ON=1
    ; Logical display dimensions (320×240 landscape after Arduino_GFX rotation=1)
    -D DISPLAY_WIDTH=320
    -D DISPLAY_HEIGHT=240
    ; Keyboard I²C — addr 0x55, INT on 46
    -D KB_SDA=18
    -D KB_SCL=8
    -D KB_INT=46
    -D KB_ADDR=0x55
    ; Firmware version
    -D FW_VERSION='"1.0.0"'

[env:tdeck_eu868]
extends   = env:tdeck
build_flags =
    ${env:tdeck.build_flags}
    -U CFG_us915
    -D CFG_eu868=1

; ── Elysian — T-Deck direct P2P mesh radio (no gateway, no server) ───────────
; Both devices share the same app_key; first 4 bytes become the net ID.
; 915.0 MHz, SF10, BW125, CR4/5  (~5-15 km with whip antennas).
[env:elysian]
extends = env:tdeck
build_flags =
    ${env:tdeck.build_flags}
    -D TRANSPORT_P2P=1
    -D P2P_FREQ_MHZ=915.0f
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    moononournation/GFX Library for Arduino @ 1.4.7
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1
    jgromes/RadioLib @ ^6.6.0

; ── Elysian Voice — T-Deck push-to-talk voice over LoRa (Codec2) ─────────────
; Half-duplex walkie-talkie: hold the trackball click (PTT) to talk, release to
; listen. Speech runs through Codec2 at an ultra-low bitrate so it fits LoRa's
; tiny pipe, then rides the same SX1262 P2P link as text.
;
; Range vs quality: the default is Codec2 700C (700 bps) on SF8/BW125 — this
; holds long range (the kids proved ~3 km on the even-slower text PHY) while
; leaving comfortable real-time headroom (a voice packet's airtime stays well
; under the audio it carries, so nothing stutters). For maximum reach at the
; cost of latency, raise VOICE_SF to 9 or 10; for close-range calls with better
; fidelity, rebuild with VOICE_CODEC2_MODE=CODEC2_MODE_1300 (or _3200).
;
; PTT_PIN defaults to GPIO0 (the BOOT pin / trackball click). If your unit wires
; the click elsewhere, override PTT_PIN on the build line.
;
; NOTE (regulatory): continuous PTT voice holds one channel for the duration of
; a transmission. On US915 ISM this can exceed FCC Part 15 dwell limits; treat
; voice as experimental / amateur-band use and keep transmissions short.
[env:elysian_voice]
extends = env:elysian
build_flags =
    ${env:elysian.build_flags}
    -D FEATURE_VOICE=1
    -D VOICE_CODEC2_MODE=CODEC2_MODE_700C
    -D VOICE_SF=8
    -D VOICE_BW_KHZ=125.0f
    -D VOICE_FRAMES_PER_PKT=9
    -D PTT_PIN=0
    ; -D DEVICE_NAME='"Zoe"'   ; (optional) name this board; shows on-screen + labels its messages
    ; Codec2 encode/decode + I2S audio need a deeper loop stack
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=20480
lib_deps =
    ${env:elysian.lib_deps}
    https://github.com/sh123/esp32_codec2_arduino.git#1.0.7

; ── GluStic Fun — Elysian + GPS + SD tile map ────────────────────────────────
; GPS: L76K on Serial1 (GPIO 44 RX / GPIO 43 TX).  Serial debug disabled.
; Map: OSM JPEG tiles on SD card at /tiles/Z/X/Y.jpg (see tools/download_tiles.py).
[env:glustic_fun]
extends = env:elysian
build_flags =
    ${env:elysian.build_flags}
    -D GLUSTIC_FUN=1
    -D GPS_RX_PIN=44
    -D GPS_TX_PIN=43
    -D MAP_DEFAULT_ZOOM=16
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    moononournation/GFX Library for Arduino @ 1.4.7
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1
    jgromes/RadioLib @ ^6.6.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    Bodmer/TJpg_Decoder @ ^1.0.8

; ── Heltec repeater — WiFi LoRa 32 V3, no keyboard ───────────────────────────
; The V3 has a 128x64 OLED and the PRG button. It cannot be a handset.
; It speaks the same P2P radio as `elysian` (915.0 MHz, SF10, BW125, CR4/5)
; and rebroadcasts each packet once. Hold PRG while it boots to forget the
; net and listen for a new one. The first family packet it hears is the net.
[env:heltec_repeater]
platform  = espressif32
board     = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_src_filter =
    +<*>
    -<main.cpp>
    -<p2p_pair.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    olikraus/U8g2 @ ^2.35.9
    ricmoo/QRCode @ ^0.0.1
    jgromes/RadioLib @ ^6.6.0
build_flags =
    -D ROLE_REPEATER=1
    -D TRANSPORT_P2P=1
    -D P2P_FREQ_MHZ=915.0f
    -D CFG_us915=1
    -D PIN_LMIC_NSS=8
    -D PIN_LMIC_RST=12
    -D PIN_LMIC_DIO1=14
    -D LORA_BUSY_PIN=13
    -D LORA_SCK=9
    -D LORA_MISO=11
    -D LORA_MOSI=10
    -D OLED_SDA=17
    -D OLED_SCL=18
    -D OLED_RST=21
    -D VBAT_PIN=1
    -D HELTEC_VEXT=36
    -D HELTEC_BTN=0
    -D HELTEC_ADC_CTRL=37
    -D FW_VERSION='"1.0.0"'

[env:heltec_repeater_eu868]
extends = env:heltec_repeater
build_flags =
    ${env:heltec_repeater.build_flags}
    -U P2P_FREQ_MHZ
    -D P2P_FREQ_MHZ=868.0f
    -U CFG_us915
    -D CFG_eu868=1

; ── Remotest — T-Deck Meshtastic mesh node ────────────────────────────────────
; LongFast PHY (SF9/BW250/CR4/5), 906.875 MHz US915.
; WiFi+MQTT bridge to mqtt.meshtastic.org; also appears on the community map.
; Credentials baked in via build flags — no keyboard entry needed.
[env:remotest]
extends = env:tdeck
build_flags =
    ${env:tdeck.build_flags}
    -D TRANSPORT_MESHTASTIC=1
    -D MESH_FREQ_MHZ=906.875f
    -D MESH_WIFI_SSID='"mortal"'
    -D MESH_WIFI_PASS='"!!AudiTT2014!!"'
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -D GPS_RX_PIN=44
    -D GPS_TX_PIN=43
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    moononournation/GFX Library for Arduino @ 1.4.7
    https://github.com/knolleary/pubsubclient @ ^2.8
    ricmoo/QRCode @ ^0.0.1
    jgromes/RadioLib @ ^6.6.0
    mikalhart/TinyGPSPlus @ ^1.0.3

[env:remotest_forever]
extends = env:remotest
build_flags =
    ${env:remotest.build_flags}
    -D MESH_NODE_NAME='"LBCForever"'

[env:remotest_remote]
extends = env:remotest
build_flags =
    ${env:remotest.build_flags}
    -D MESH_NODE_NAME='"LBCRemote"'
